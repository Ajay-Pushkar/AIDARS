# M10.12/M10.13: minimum realistic multi-worker topology -- one
# Coordinator plus three Workers (A/B/C) -- run with `docker compose up`
# from this directory. Secrets (AIDAR_ADMIN_TOKENS,
# AIDAR_WORKER_BOOTSTRAP_SECRET) are supplied via a local `.env` file
# (see .env.example) that is NEVER committed; nothing here embeds a real
# credential.
#
# A static-IP network is used because WorkerRegistrationPayload.ip_address
# (models.py) is validated as a real IP address, not a DNS hostname --
# Docker Compose's default per-service DNS name can't satisfy that
# validation, so each service is given a fixed address on a dedicated
# bridge network instead.

services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aidars:latest
    command: ["aidars-coordinator"]
    environment:
      AIDAR_COORDINATOR_HOST: "0.0.0.0"
      AIDAR_COORDINATOR_PORT: "8000"
      AIDAR_COORDINATOR_DB_PATH: "/app/data/coordinator_state.db"
      AIDAR_ADMIN_TOKENS: "${AIDAR_ADMIN_TOKENS:?set AIDAR_ADMIN_TOKENS in .env}"
      AIDAR_WORKER_BOOTSTRAP_SECRET: "${AIDAR_WORKER_BOOTSTRAP_SECRET:?set AIDAR_WORKER_BOOTSTRAP_SECRET in .env}"
      AIDAR_INSECURE_MODE: "${AIDAR_INSECURE_MODE:-0}"
    ports:
      - "8000:8000"
    volumes:
      - coordinator_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      aidar_net:
        ipv4_address: 172.28.0.10

  worker-a: &worker
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aidars:latest
    command: ["aidars-worker"]
    environment: &worker_env
      AIDAR_WORKER_BIND_HOST: "0.0.0.0"
      AIDAR_WORKER_PORT: "8001"
      AIDAR_COORDINATOR_URL: "http://172.28.0.10:8000"
      AIDAR_WORKER_CAS_DIR: "/app/data/cas"
      AIDAR_WORKER_BOOTSTRAP_SECRET: "${AIDAR_WORKER_BOOTSTRAP_SECRET:?set AIDAR_WORKER_BOOTSTRAP_SECRET in .env}"
      AIDAR_INSECURE_MODE: "${AIDAR_INSECURE_MODE:-0}"
      AIDAR_WORKER_ID: "worker-a"
      AIDAR_WORKER_IP: "172.28.0.11"
    depends_on:
      coordinator:
        condition: service_healthy
    volumes:
      - worker_a_data:/app/data
    networks:
      aidar_net:
        ipv4_address: 172.28.0.11

  worker-b:
    <<: *worker
    environment:
      <<: *worker_env
      AIDAR_WORKER_ID: "worker-b"
      AIDAR_WORKER_IP: "172.28.0.12"
    volumes:
      - worker_b_data:/app/data
    networks:
      aidar_net:
        ipv4_address: 172.28.0.12

  worker-c:
    <<: *worker
    environment:
      <<: *worker_env
      AIDAR_WORKER_ID: "worker-c"
      AIDAR_WORKER_IP: "172.28.0.13"
    volumes:
      - worker_c_data:/app/data
    networks:
      aidar_net:
        ipv4_address: 172.28.0.13

networks:
  aidar_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  coordinator_data:
  worker_a_data:
  worker_b_data:
  worker_c_data:
